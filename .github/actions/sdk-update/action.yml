name: "SDK Update"
description: "Update Uno Sdk"

inputs:
  branch:  # id of input
    description: 'base branch'
    required: true
    default: 'main'
  exclude-file:  # packages to exclude for the update
    description: 'Path to the JSON exclude file'
    required: false
    default: '.github/sdk-update-exclude.json'

runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # nbgv is pre-installed on the runner image as a .NET 10 build, and
        # `dotnet tool update` won't downgrade it to the pinned toolVersion,
        # so a .NET 10 runtime must be present or `nbgv get-version` fails
        # (exit 150). Keep 8.0.407 for the net8.0 Uno.Sdk.Updater tool.
        dotnet-version: |
          8.0.407
          10.0.x

    - uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # v0.4.2
      id: nbgv
      with:
        toolVersion: 3.10.91
        setAllVars: true

    - name: Run Uno Sdk Updater
      shell: pwsh
      run: dotnet run -c Release --project tools/Uno.Sdk.Updater -- --exclude-file "${{ inputs['exclude-file'] }}"
