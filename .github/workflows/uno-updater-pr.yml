name: Update Uno Sdk (PR)

on:
  pull_request:
    branches:
      - main
      - release/stable/*
      - servicing/*
    paths:
      - .github/workflows/uno-updater-pr.yml
      - .github/actions/sdk-update/*
      - .github/sdk-update-exclude.json
      - tools/Uno.Sdk.Updater/**
      - tools/Uno.Sdk.Updater.Tests/**
  
concurrency:
  group: ${{github.workflow}} - ${{github.ref}}
  cancel-in-progress: true

jobs:
  manifest-update:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Sdk Update"
      uses: ./.github/actions/sdk-update

    - name: "Sdk Updater Tests"
      run: dotnet test tools/Uno.Sdk.Updater.Tests