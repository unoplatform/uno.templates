name: CI

on:
  push:
    branches:
      - main
      - release/**

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**

  schedule:
    - cron: '0 0 * * *' # Canary

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or ref to run CI on'
        required: true
        default: 'main'
  
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ !contains(github.ref, 'refs/heads/release/') && !contains(github.ref, 'refs/heads/main')}}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CheckoutRef: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
  IsCanaryBranch: ${{ startsWith(github.ref, 'refs/heads/canaries/') }}
  ValidationUnoCheckVersionNet9: '1.32.23'
  ValidationUnoCheckVersionNet10: '1.33.0-dev.30'
  ValidationDotNetVersion: '9.0.308'
  XcodeVersionNet9: '/Applications/Xcode_26.2.app'
  XcodeVersionNet10: '/Applications/Xcode_26.2.app'

  # https://github.com/unoplatform/Uno.Wasm.Bootstrap/pull/887 remove when upgarding to .NET 9
  # compatible version of the bootstrapper
  UnoDisableNet9Validation: true

  # Required for WinUI 1.6
  WindowsSdkPackageVersion: '10.0.19041.57'

  # Required for WinAppSDK native AOT, to remove when included in uno.sdk
  AllowUnsafeBlocks: true

  # Reduce the number of downloaded packages
  RestoreEnablePackagePruning: true

jobs:

  # Build the nuget packages
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        ref: ${{ env.CheckoutRef }}

    - name: Free disk space (Linux)
      uses: ./.github/actions/host-cleanup-linux

    - name: "Build Package"
      uses: ./.github/actions/ci/build-packages

  # The nuget.org dependency verification is a HARD GATE only on the publication paths, and it runs
  # as the first step (after checkout) INSIDE the publish job itself (not as a separate job):
  #   * dev publish  (push to main)       -> first step of publish_dev
  #   * prod publish (push to release/**) -> first step of publish_release_nuget_org, which sits
  #     behind the Production (release) approval, so verification runs only when we are actually
  #     ready to publish the stable packages -- by then the dependency stables are already public.
  # On PRs it is NOT a gate: the build restores from the internal feed, so a dev package not yet on
  # nuget.org does not block the PR -- report_dependencies surfaces it as a resolvable comment.

  # Non-blocking PR advisory: surface any prerelease (dev) dependency the manifest references that is
  # not yet on nuget.org as a resolvable inline PR comment. Never blocks the PR -- the build restores
  # from the internal feed, and the hard gate lives only on the publish paths. Direct manifest
  # entries only (depth 0) to keep the PR run cheap.
  report_dependencies:
    name: Report Missing Dependencies
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: "Collect dev dependencies missing from nuget.org"
      shell: pwsh
      run: |
        ./build/Verify-NuGetDependenciesOnNuGetOrg.ps1 -ManifestPath src/Uno.Sdk/packages.json -PrereleaseDependenciesOnly -ReportOnly -ReportOutputPath missing-dependencies.json -TransitiveDependencyDepth 0 -MaxAttempts 3 -RetryDelaySeconds 5 -HttpTimeoutSeconds 30

    - name: "Post resolvable inline comment(s) for missing dev dependencies"
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./build/Report-MissingDependenciesOnPr.ps1 -Repository "${{ github.repository }}" -PullNumber ${{ github.event.pull_request.number }} -HeadSha "${{ github.event.pull_request.head.sha }}" -ReportPath missing-dependencies.json

  # Sign the nuget packages
  sign:
    name: Sign Package
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: windows-latest

    environment: PackageSign
  
    permissions:
      id-token: write # Required for requesting the JWT

    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        ref: ${{ env.CheckoutRef }}
    - name: "Sign Packages"
      uses: ./.github/actions/ci/sign-package
      with:
        sign-client-id: ${{ secrets.SIGN_AZURE_CLIENT_ID }}
        sign-tenant-id: ${{ secrets.SIGN_AZURE_TENANT_ID }}
        sign-azure-subscription-id: ${{ secrets.SIGN_AZURE_SUBSCRIPTION_ID }}
        sign-key-vault-url: ${{ secrets.SIGN_KEY_VAULT_URL }}
        sign-key-vault-cert-id: ${{ secrets.SIGN_KEY_VAULT_CERTIFICATE_ID }}

  # Publish dev packages to uno feed and nuget.org
  publish_dev:
    name: Publish Dev
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: sign

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        ref: ${{ env.CheckoutRef }}
    # First step after checkout: verify the full Uno.* closure is on nuget.org before publishing there.
    - name: "Verify Uno.* dependency closure on nuget.org"
      shell: pwsh
      run: |
        ./build/Verify-NuGetDependenciesOnNuGetOrg.ps1 -ManifestPath src/Uno.Sdk/packages.json -MaxAttempts 3 -RetryDelaySeconds 10 -HttpTimeoutSeconds 30
    - name: "Uno Feed Publish"
      uses: ./.github/actions/ci/nuget-uno-publish
      with:
        token: ${{ secrets.UNO_NUGET_FEED_API_KEY }}
    - name: "nuget.org Publish"
      uses: ./.github/actions/ci/nuget-org-publish
      with:
        token: ${{ secrets.NUGET_ORG_API_KEY }}

  # Publish release packages to the Uno production (internal) feed -- the FIRST approval gate of a
  # stable release (environment: Production). Once approved, the internal packages exist so the test
  # matrix can run against them; the public nuget.org publish is a SEPARATE, later approval, so tests
  # run during the window between the two approvals (we take our time testing before going public).
  publish_release_uno:
    name: Publish Uno Production
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    environment: Production
    needs: sign

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        ref: ${{ env.CheckoutRef }}
    - name: "Uno Feed Publish"
      uses: ./.github/actions/ci/nuget-uno-publish
      with:
        token: ${{ secrets.UNO_NUGET_FEED_API_KEY }}

  # Publish release packages to nuget.org -- the public stable publication and the SECOND approval
  # gate (environment: Production), taken after the internal publish + tests. Its first step (after
  # checkout) verifies the full Uno.* dependency closure is already on nuget.org, so we never push a
  # stable package whose (previously-released) stable dependencies are not yet public. Because it runs
  # only after this second approval, the check happens exactly when we are ready to go public -- by
  # then the dependency stables have been published in order. Tests do NOT wait on this gate.
  publish_release_nuget_org:
    name: Publish NuGet.org Production
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    environment: Production
    needs: publish_release_uno

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        ref: ${{ env.CheckoutRef }}
    # First step after checkout: verify the full Uno.* closure is on nuget.org before the public publish.
    - name: "Verify Uno.* dependency closure on nuget.org"
      shell: pwsh
      run: |
        ./build/Verify-NuGetDependenciesOnNuGetOrg.ps1 -ManifestPath src/Uno.Sdk/packages.json -MaxAttempts 3 -RetryDelaySeconds 10 -HttpTimeoutSeconds 30
    - name: "nuget.org Publish"
      uses: ./.github/actions/ci/nuget-org-publish
      with:
        token: ${{ secrets.NUGET_ORG_API_KEY }}
    - name: "Tag Release"
      uses: ./.github/actions/ci/tag-release

  # Generate the template tests build matrix.
  # On a merge build the matrix waits for build -> sign -> publish_dev (main) / publish_release_uno
  # (the internal-feed release publish, the FIRST approval gate), then runs against the published
  # internal packages. It deliberately does NOT wait for publish_release_nuget_org -- the public
  # publish is a SECOND, later approval, and tests are meant to run during the window before it, so
  # blocking on it would defeat the point. On PRs / schedule / dispatch the publish jobs are skipped,
  # so the skip-tolerant condition lets the matrix run once `build` finishes.
  # always() is required so the condition is evaluated when the publish jobs are skipped.
  generate-test-matrix:
    runs-on: ubuntu-latest
    name: Generate Test Matrix
    needs:
      - build
      - publish_dev
      - publish_release_uno
    if: >-
      ${{ always()
      && needs.build.result == 'success'
      && (needs.publish_dev.result == 'success' || needs.publish_dev.result == 'skipped')
      && (needs.publish_release_uno.result == 'success' || needs.publish_release_uno.result == 'skipped') }}

    outputs:
      testMatrix: ${{ steps.generate-test-matrix-step.outputs.TestMatrix }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        ref: ${{ env.CheckoutRef }}

    - name: "Test Matrix"
      id: generate-test-matrix-step
      uses: ./.github/actions/ci/generate-test-matrix

  # Run the test matrix on linux
  linux-template-tests:
    runs-on: ubuntu-latest
    needs:
    - generate-test-matrix
    - build
    # Explicit condition: generate-test-matrix runs via always() and transitively depends on the
    # publish jobs (skipped on PRs), which would poison this job's implicit success() and skip it.
    # Run whenever the matrix + build succeeded, regardless of those skipped publish ancestors.
    if: >-
      ${{ always()
      && needs.generate-test-matrix.result == 'success'
      && needs.build.result == 'success' }}

    name: Linux Tests (${{ matrix.groupName }})

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-test-matrix.outputs.testMatrix) }}

    env:
      UseDotNetNativeToolchain: false
      unocheckArguments: ''

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CheckoutRef }}

    - name: "Run Tests"
      uses: ./.github/actions/ci/run-tests
      with:
        arguments: ${{ matrix.validations }}
        unocheckArguments: ${{ matrix.unocheckArguments }}
        logs-artifact-name: ${{ matrix.groupName }}

  # Run the test matrix on Windows
  windows-template-tests:
    runs-on: windows-latest
    needs:
    - generate-test-matrix
    - build
    # See Linux Tests: run whenever the matrix + build succeeded, ignoring skipped publish ancestors.
    if: >-
      ${{ always()
      && needs.generate-test-matrix.result == 'success'
      && needs.build.result == 'success' }}

    name: Windows Tests (${{ matrix.groupName }})

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-test-matrix.outputs.testMatrix) }}

    env:
      UseDotNetNativeToolchain: false
      unocheckArguments: ''

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CheckoutRef }}
    
    - name: "Run Tests"
      uses: ./.github/actions/ci/run-tests
      with:
        arguments: ${{ matrix.validations }}
        unocheckArguments: ${{ matrix.unocheckArguments }}
        logs-artifact-name: ${{ matrix.groupName }}

  # Run the test matrix on macOS
  macos-template-tests:
    runs-on: macos-15
    needs:
    - generate-test-matrix
    - build
    # See Linux Tests: run whenever the matrix + build succeeded, ignoring skipped publish ancestors.
    if: >-
      ${{ always()
      && needs.generate-test-matrix.result == 'success'
      && needs.build.result == 'success' }}

    name: macOS Tests (${{ matrix.groupName }})

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-test-matrix.outputs.testMatrix) }}

    env:
      UseDotNetNativeToolchain: false
      unocheckArguments: ''

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CheckoutRef }}
    
    - name: "Run Tests"
      uses: ./.github/actions/ci/run-tests
      with:
        arguments: ${{ matrix.validations }}
        unocheckArguments: ${{ matrix.unocheckArguments }}
        logs-artifact-name: ${{ matrix.groupName }}

  test-validation:
    name: Tests Validation
    runs-on: ubuntu-latest
    if: always()
    needs:
      - macos-template-tests
      - linux-template-tests
      - windows-template-tests

    steps:
      - name: Check matrix job results
        run: |
          hasFailed=false

          macos_status="${{ needs.macos-template-tests.result }}"
          linux_status="${{ needs.linux-template-tests.result }}"
          windows_status="${{ needs.windows-template-tests.result }}"

          echo "macos-template-tests: $macos_status"
          if [ "$macos_status" = "failure" ]; then
            echo "::error::macos-template-tests failed (status: $macos_status)"
            hasFailed=true
          fi

          echo "linux-template-tests: $linux_status"
          if [ "$linux_status" = "failure" ]; then
            echo "::error::linux-template-tests failed (status: $linux_status)"
            hasFailed=true
          fi

          echo "windows-template-tests: $windows_status"
          if [ "$windows_status" = "failure" ]; then
            echo "::error::windows-template-tests failed (status: $windows_status)"
            hasFailed=true
          fi

          if [ "$hasFailed" = "true" ]; then
            echo "::error::One or more test jobs failed. Blocking merge."
            exit 1
          fi

      - name: All tests passed
        if: ${{ success() }}
        run: echo "✅ All matrix test jobs passed."

